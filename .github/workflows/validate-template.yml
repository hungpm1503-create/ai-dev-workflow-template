name: Validate workflow template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and scan common secret patterns
        run: bash scripts/validate-workflow.sh
      - name: Regression test Project Doctor (offline)
        run: bash scripts/test-project-doctor.sh
      - name: Regression test secret detection (synthetic tokens only)
        run: bash scripts/test-secret-scan.sh
      - name: Validate adaptive Spec Kit routing and high-risk safeguards (offline)
        run: bash scripts/test-task-routing.sh
      - name: Regression test delegation (fake Codex, no API calls)
        run: bash scripts/test-codex-delegate.sh
      - name: Test protected-path hook for Claude Code (offline)
        run: bash scripts/test-guard-hook.sh
      - name: Test auto-verify Stop hook (offline, throwaway repo)
        run: bash scripts/test-auto-verify.sh
      - name: Regression test experience capture (offline synthetic fixture)
        run: bash scripts/test-capture-experience.sh
      - name: Test working-memory checkpoints (offline, no API/model)
        run: bash scripts/test-workflow-memory.sh
      - name: Benchmark small coding task and resume-context size (offline)
        run: bash scripts/benchmark-workflow-resume.sh
      - name: Prepare fair real-Codex pilot fixtures (offline, zero model calls)
        run: bash scripts/benchmark-codex-ab.sh --prepare-only

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test Bash 3.2 scripts and safety hooks (no model)
        run: |
          set -e
          bash_shim="$(mktemp -d)"
          trap 'rm -rf "$bash_shim"' EXIT
          ln -s /bin/bash "$bash_shim/bash"
          export PATH="$bash_shim:$PATH"
          hash -r
          bash --version | head -n 1
          [[ "$(bash --version | head -n 1)" == *"version 3.2."* ]] || { echo "FAIL: nested bash is not 3.2" >&2; exit 1; }
          /bin/bash scripts/validate-workflow.sh
          /bin/bash scripts/test-project-doctor.sh
          /bin/bash scripts/test-guard-hook.sh
          /bin/bash scripts/test-auto-verify.sh
          /bin/bash scripts/test-codex-delegate.sh
